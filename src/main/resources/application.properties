spring.application.name=library-management-system

# ===================== Database (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
# 'update' auto-creates/updates tables from the entities; use Flyway/Liquibase
# migrations instead of ddl-auto in a real production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== Thymeleaf =====================
spring.thymeleaf.cache=false

# ===================== Server =====================
server.port=8081

# ===================== Library business rules =====================
# Loan period in days from the moment a book is borrowed.
library.loan.duration-days=14
# Fine charged per day late, in LKR.
library.fine.daily-rate=50.0
# A returning member is auto-blacklisted once a single fine exceeds this amount.
library.fine.blacklist-threshold=500.0

spring.application.name=smart-library
# Optional per-user settings file (used by the packaged desktop app): %USERPROFILE%/.smart-library/application.properties
spring.config.import=optional:file:${user.home}/.smart-library/application.properties
server.port=8082

# ---------- Database (override with environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:}

# Local development only. For production use Flyway/Liquibase and set this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Mail (optional; app starts without it) ----------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Library business rules ----------
library.borrow-days=14
library.max-active-loans=5
library.fine-rate-per-day=20.00
library.blacklist-threshold=500.00
library.currency=LKR
library.contact.name=Smart Library
library.contact.email=${LIBRARY_CONTACT_EMAIL:library@example.com}
library.contact.phone=${LIBRARY_CONTACT_PHONE:+94 00 000 0000}

# ---------- Serial / Arduino ----------
# Leave port empty to auto-detect; or set e.g. COM3 on Windows.
library.serial.port=COM6
library.serial.baud-rate=9600
library.serial.enabled=${SERIAL_ENABLED:true}
library.serial.reconnect-delay-ms=5000
library.serial.heartbeat-timeout-ms=6000
library.serial.duplicate-window-ms=2000

# ---------- Scheduler ----------
library.reminders.enabled=true
library.reminders.cron=0 0 8 * * *
library.reminders.zone=Asia/Colombo
library.reminders.from=${MAIL_FROM:no-reply@example.com}

# ---------- Initial admin (created ONLY if no admin exists and both are set) ----------
library.admin.initial-username=${ADMIN_USERNAME:}
library.admin.initial-password=${ADMIN_PASSWORD:}
library.admin.initial-staff-username=${STAFF_USERNAME:}
library.admin.initial-staff-password=${STAFF_PASSWORD:}

logging.level.com.library=INFO

# ---------- RFID counter ----------
library.counter.member-timeout-seconds=60
library.counter.history-size=25

# ---------- Desktop mode (tray icon + app window). Set by the packaged launcher; leave false for development ----------
library.desktop.enabled=${DESKTOP_MODE:false}

# ---------- Log file (useful when running as a desktop app) ----------
logging.file.name=${LOG_FILE:${user.home}/.smart-library/smart-library.log}

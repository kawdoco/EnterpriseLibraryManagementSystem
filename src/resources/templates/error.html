<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="login-wrap">
    <div class="card login-card shadow-lg">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-exclamation-octagon text-danger" style="font-size:2.6rem" aria-hidden="true"></i>
            <p class="display-6 mb-1" th:text="${status} ?: 'Error'">500</p>
            <h1 class="h5" th:text="${title} ?: (${error} ?: 'Something went wrong')">Something went wrong</h1>
            <p class="text-muted" th:text="${message} ?: 'The request could not be completed.'">Message</p>
            <div class="d-flex gap-2 justify-content-center">
                <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house"></i> Dashboard</a>
                <a class="btn btn-outline-secondary" href="javascript:history.back()">Go back</a>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div class="login-wrap">
    <div class="card login-card shadow-lg">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-book-half logo" aria-hidden="true"></i>
                <h1 class="h4 mt-2 mb-0" th:text="${libraryName} ?: 'Smart Library'">Smart Library</h1>
                <p class="text-muted small mb-0">Administrator sign in</p>
            </div>

            <div class="alert alert-danger py-2" role="alert" th:if="${param.error}">
                Incorrect username or password.
            </div>
            <div class="alert alert-success py-2" role="alert" th:if="${param.logout}">
                You have been signed out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
            </form>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
